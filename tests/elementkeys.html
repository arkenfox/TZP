<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=500">
	<title>elements: keys</title>
	<link rel="stylesheet" type="text/css" href="testindex.css">
	<script src="testglobals.js"></script>
	<script src="testgeneric.js"></script>
	<script src="testelements.js"></script>
	<style>
		table {width: 90%; min-width: 480px; max-width: 780px}
	</style>
</head>

<body>
	<table>
		<col width="25%"><col width="50%"><col width="25%">
		<tr><td></td><td colpsan="3"><h2>TorZillaPrint</h2></td><td></td></tr>
		<tr>
			<td id="navprev" style="text-align: left;"></td>
			<td class="blurb"><a class="return" href="../index.html#elements">return to TZP index</a></td>
			<td id="navnext" style="text-align: right;"></td>
		</tr>
	</table>

	<table id="tb15">
		<thead><tr><th>
			<div class="nav-title">elements: keys
				<div class="nav-up"><span class="c perf" id="perf"></span></div>
			</div>
		</th></tr></thead>
		<tr><td class="intro">
			<span class="btn15 btnfirst" onClick="run(`everything`)">[ everything ]</span>
			<span class="btn15 btnfirst" onClick="run(`TZP`)">[ TZP ]</span>
			<span class="btn15 btnfirst" onClick="list_elements()">[ elements ]</span>
			<span class="btn15 btnfirst" onClick="copyclip('elements')">[ COPY ]</span>
		</td></tr>
		<tr><td><hr></td></tr>
		<tr><td></td></tr>
		<tr><td style="text-align: left; color: var(--test0);" class="mono spaces" id="elements"></td></tr>
	</table>
	<br>

<script>
'use strict';
let oData = {}, oRaw = {}, oCommon = {}, oFP = {}, defaultType = 'TZP'
let strElement

function log_console(name) {
	let hash = mini(name)
	if (name == "oElementKeys.all") {
		console.log(name +": " + hash +"\n"+ "'"+ oElementKeys.all.join("',\n'") +"'")
	}
}

function list_elements() {
	dom.perf.innerHTML = ''
	if (undefined == strElement) {
		let aAll = oElementKeys.all
		let aAllCheck = aAll.filter(function(item, position) {return aAll.indexOf(item) === position})
		let sanityStr = ''
		if (aAll.length !== aAllCheck.length) {
			sanityStr = sb+' [duplicates]'+sc
			console.log('duplicates\n', aAll)
		}
		let sKey = '<span class="key">',
			sNumber = '<span class="number">',
			sString = '<span class="string">',
			sNone = '<span class="no_color bold">'

		let countTotal = oElementKeys.all.length
		let allBtn = " <span class='btn15 btnc' onClick='log_console(`oElementKeys.all`)'>["+ countTotal +"]</span>"
		strElement = '<u>ELEMENTS</u>'+ allBtn + sanityStr +'<br><br>'
		// redundant
		let displayRedundant = []
		oElementKeys.ignore_plain.forEach(function(item){
			if (aElementKeysIfSupported.includes(item)) {item += sNone +'<sup>[a]</sup>'+ sc}
			displayRedundant.push(item)
		})
		strElement += '{<br><div class="indent">'+
			sKey +'redundant: ' + sc +'{ ' + sNumber + oElementKeys.ignore_plain.length + sc
				+'<br><div class="indent">'+ sString + displayRedundant.join(', ') + sc +'</div><br>}'
			+'</div><br>}'

		let displayTZP = []
		oElementKeys.list_plain.forEach(function(item){
			if (aElementKeysIfSupported.includes(item)) {item += sNone +'<sup>[a]</sup>'+ sc}
			displayTZP.push(item)
		})
		strElement += '<br>{<br><div class="indent">'+
			sKey +'TZP: ' + sc +'{ ' + sNumber + oElementKeys.list_plain.length + sc
				+'<br><div class="indent">'+ sString + displayTZP.join(', ') + sc +'</div><br>}'
			+'</div><br>}'
		if (aElementKeysIfSupported.length) {strElement += '<br><br>[a] if supported'}
	}
	dom.elements.innerHTML = strElement
}


function get_elements(type) {
	if (undefined == type) {type = defaultType}
	// set/reset
	let t0 = performance.now()
	oData = {}
	oCommon = {}
	oRaw = {}
	oFP = {'common': {}, 'elements': {}}

	let aSkip = 'TZP' == type ? oElementKeys.list_skip : []
	let aListUsed = 'TZP' == type ? oElementKeys.list : oElementKeys.list.concat(oElementKeys.ignore)
	let hasTampered = false
	try {
		let parser = new DOMParser
		let doc = parser.parseFromString(aListUsed.join(''), "text/html")
		let obj = doc.all // servo: obj is undefined
		// LIST
		for (const k of Object.keys(obj)) {
			let name = obj[k].localName
			if (!aSkip.includes(name)) {
				// skip non supported items
				let isSupported = true
				if (aElementKeysIfSupported.includes(name)) {
					if (undefined !== oIsSupported[name]) {isSupported = oIsSupported[name]}
				}
				if (isSupported) {
					if ('input' == name) {
						if ('isindex' == obj[k].name) {
							name = 'isindex' // FF55 or lower
						} else {
							name = obj[k].outerHTML //'<input type="button">' etc
							if (name.includes('input multiple')) {
								name = 'input|files'
							} else if (name.includes('webkitdirectory')) {
								name = 'input|directory'
							} else {
								name = name.replace(' type=', '|')
								name = name.replace(/</g, '')
								name = name.replace(/>/g, '')
								name = name.replace(/"/g, '')
							}
						}
					}
					let keys = []
					for (const key in obj[k]) {keys.push(key)}
					oRaw[name] = {'hash': mini(keys), 'data': keys}
				}
			}
		}
		// ADDITIONAL: we have to get frameset/frame separately
		doc = parser.parseFromString(oElementKeys.additional, "text/html")
		obj = doc.all
		aSkip = oElementKeys.automatic
		for (const k of Object.keys(obj)) {
			let name = obj[k].localName
			if (!aSkip.includes(name)) {
				let keys = []
				for (const key in obj[k]) {keys.push(key)}
				oRaw[name] = {'hash': mini(keys), 'data': keys}
			}
		}

		// group by hash + split array
		let oTemp = {}
		let splitValue = isFF ? 'click' : 'title' // title works for chrome + safari
		try {splitValue = oRaw.head.data[0]} catch(e) {}
		// if a splitUsed doesn't exist it basically ends up as everything mapped to
		// the last key = dispatchEvent on gecko, when on blink
		// splitValue = 'groot' // test

		for (const k of Object.keys(oRaw)) {
			let key = oRaw[k].hash
			// we'll do this for every element so I can track how many elements per common hash
			// instead of checking for undefined == oTemp[key]

			// split
			let keys = oRaw[k].data, aPre = [], aPost = []
			let splitUsed = splitValue
			if ('math' == k || 'svg' == k) {
				if (keys.includes('classList')) {splitUsed = 'classList' } // works on blink + gecko
			}

			let splitIndex = keys.indexOf(splitUsed)
			aPre = keys.slice(0, splitIndex) // unique stuff
			aPost = keys.slice(splitIndex, keys.length) // common stuff
			let posthash = mini(aPost)
			// posthash tampering
			if (oCommon[posthash] == undefined) {
				oCommon[posthash] = {
					'data': aPost,
					'display': [],
					'elements': [],
				}
				let postTamper = []
				aPost.forEach(function(r) {
					if (r.includes(' ')) {
						oCommon[posthash].display.push(sb + r + sc)
						postTamper.push(r)
					} else {
						oCommon[posthash].display.push(r)
					}
				})
				if (postTamper.length) {
					hasTampered = true
					oCommon[posthash]["tampered"] = postTamper
				}
			}
			oCommon[posthash].elements.push(k)

			// add the commonhash to pre data
			// note: because aPre contains the commonhash, no aPre data can be alike across different commons
				// i.e two elements with the same aPre of X: one has a commonhash of C1, the other C2
				// the final aPres will always be unique: [x,C1] and [x, C2]
			aPre.push(posthash)
			let prehash = mini(aPre)
			if (undefined == oTemp[key]) {
				oTemp[key] = {
					'count': aPre.length,
					'data': keys,
					'group': [k],
					'predata': aPre,
					'prehash': prehash,
					'posthash': posthash
				}
			} else {
				oTemp[key].group.push(k)
			}
		}

		// sort into oData by hash, and determine oOrder (by first element name)
		let oOrder = {}
		for (const k of Object.keys(oTemp).sort()) {
			oData[k] = oTemp[k]
			let aTmp = oData[k].group.sort() // sort array in oData
			oOrder[aTmp.join(' ')] = k
		}
		// populate/build oFP: oData is fine for displaying info in this PoC but it's not what we want for TZP's FP style
		// create correct objects
		let newCommon = {}, oCount = {}
		for (const k of Object.keys(oCommon)) {
			newCommon[k] = oCommon[k].data
			oCount[k] = oCommon[k].elements.length
		}
		// get most common as control
		let ctrlcount = 0, ctrlkey
		for (const k of Object.keys(oCount)) {
			if (oCount[k] > ctrlcount) {ctrlkey = k; ctrlcount = oCount[k]}
		}
		ctrlcount = newCommon[ctrlkey].length
		let ctrldata = newCommon[ctrlkey]
		// simplify newcommon
		for (const k of Object.keys(newCommon)) {
			if (ctrlkey !== k) {
				// if the test array is only a few LESS than the control
				let diff = ctrlcount - newCommon[k].length
				if (diff > 0 && diff < 10) {
					// what is missing in the test array
					let aNotInCtrl = ctrldata.filter(x => !newCommon[k].includes(x))
					// remove those from ctrl and if hashes match then ...
					let aCtrlMinusMissing = ctrldata.filter(x => !aNotInCtrl.includes(x))
					if (mini(aCtrlMinusMissing) == k) {
						// identical except for those missing: simplify
						// update oCommon display to reflect the change
						newCommon[k] = [ctrlkey]
						oCommon[k].display = [s12 + ctrlkey + sc]
						aNotInCtrl.forEach(function(item){
							newCommon[k].push('-'+ item)
							oCommon[k].display.push('-'+ item)
						})
					}
				}
			}
		}
		// build fingerprint
		let counter = 0
		for (const k of Object.keys(newCommon).sort()) {
			counter++ // start at 1
			oFP.common[(counter+'').padStart(2,'0') +'. '+ k] = newCommon[k]
		}
		for (const k of Object.keys(oOrder).sort()) {
			let obj = oData[oOrder[k]]
			oFP.elements[k] = obj.predata
		}
		dom.perf.innerHTML = Math.round(performance.now() - t0) +' ms' // perf

		// display
		let display = [], totalResults = Object.keys(oData).length
		let expectedTests = type == 'TZP' ? oElementKeys.list_plain.length : oElementKeys.all.length
		let notexpected = 0	
		for (const k of Object.keys(oIsSupported)) {
			if (false == oIsSupported[k]) {
				// we need to check if we remove an item based on if it's TZP
				if ('TZP' == type) {
					if (oElementKeys.list_plain.includes(k)) {notexpected++}
				} else {
					notexpected++
				}
			}
		}
		expectedTests = expectedTests - notexpected

		let actualTests = Object.keys(oRaw).length
		let strMatch = expectedTests == actualTests ? '' : sb + ' [expected '+ expectedTests +']' + sc // sanity check

		let strAll = mini(oFP) +' [' +s15 + type + sc +' | '+ actualTests +' elements'
			+ strMatch +' | ' + totalResults +' hashes]' +
				' <span class="btn15 btnc" onclick="console.log(oFP)">[details]</span>'
			+'<br><br><hr>'

		display.push(strAll)

		// COMMON
		let tamperLen = 6
		let toggle = 'common'
		display.push(
			"<span id='labelhidden" + toggle + "' class='btnfirst btn0' onClick=\"togglerows('hidden" + toggle +"','expand')\">[ expand ]</span> "
			+ s15 + 'COMMON'+ sc +'<br>')
		for (const j of Object.keys(oCommon).sort()) {
			let obj = oCommon[j]
			let countTampered = hasTampered ? ' '.repeat(tamperLen) : ''
			if (obj.tampered !== undefined) {
				countTampered = sb + ('['+ obj.tampered.length +']').padStart(tamperLen) + sc
			}
			let elementCommon = oCommon[j].elements.sort()
			let countCommon = (' ['+ elementCommon.length +']').padStart(6)
			let strCommon = ' '
			if (elementCommon.length < 6) {strCommon = ' '+ elementCommon.join(' ')}
			display.push(
				s12 + j + sc + (" ["+ obj.data.length +"]").padStart(6) + countTampered + countCommon + strCommon
					+	" <span class='toghidden" + toggle +" hidden faint'>[<br>" + "<span class='indent'>" + obj.display.join(", ") +"</span><br>]</span>"
			)
		}

		// ELEMENT DETAIL
		display.push('<br><hr>')
		toggle = 'default'
		display.push(
			"<span id='labelhidden" + toggle + "' class='btnfirst btn0' onClick=\"togglerows('hidden" + toggle +"','expand')\">[ expand ]</span>"
			+ s15 + 'ELEMENTS'+ sc +'<br>')
		for (const j of Object.keys(oOrder).sort()) {
			let k = oOrder[j]
			let obj = oData[k]
			let commonhash = obj.posthash
			// color up common and detect/count/color tampering for visuals
			let tmpdisplay = [], tmptamper = 0
			obj.predata.forEach(function(item){
				//if ('cite' == item) {item = 'to cite'} // test
				if (item == commonhash) {
					item = s12 + item + sc
				} else if (item.includes(' ')) {
					item = sb + item + sc
					tmptamper++
				}
				tmpdisplay.push(item)
			})
			let strTamper = tmptamper > 0 ? sb +' ['+ tmptamper +']'+ sc : ''

			display.push(
				s6 + k + sc +": " + obj.prehash + (" ["+ obj.predata.length +"]").padStart(6) + strTamper
				+ s99 +" ("+ obj.posthash +")"+ sc
				+" "+ obj.group.join(", ") +	"<span class='toghidden" + toggle
				+" hidden faint'>[<br>" + "<span class='indent'>" + tmpdisplay.join(", ") +"</span><br>]</span>"
			)
		}
		dom.elements.innerHTML = display.join('<br>')

/*
console.log(Object.keys(oRaw).length, 'oRaw\n', oRaw)
console.log(Object.keys(oTemp).length, 'oTemp\n', oTemp)
console.log('oCommon\n', oCommon)
console.log('oData\n', oData)
console.log('oOrder\n', oOrder)
//*/


	} catch (e) {
		dom.elements.innerHTML = e+''
	}
}

function run(type) {
	// clear
	dom.elements.innerHTML = ''
	// pause so users see change
	setTimeout(function() {
		get_elements(type)
	}, 170)
}

Promise.all([
	get_globals(),
]).then(function(){
	buildnav_element()
	build_element_keys()
	run()
})

</script>
</body>
</html>
